name: Deadikace Auto-Publish Agent

on:
  schedule:
    # Six runs a day, every 3 hours (05:23-20:23 UTC). The odd minute is
    # deliberate: GitHub delays or silently drops scheduled runs that start
    # exactly on the hour, when everyone's jobs fire at once.
    - cron: "23 5,8,11,14,17,20 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

# Never run two publish jobs at once (they could draft the same story twice).
concurrency:
  group: deadikace-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        working-directory: src
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_API_BASE_URL: ${{ secrets.WP_API_BASE_URL }}
          WP_PROXY_TOKEN: ${{ secrets.WP_PROXY_TOKEN }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TARGET_CATEGORY: ${{ secrets.TARGET_CATEGORY }}
          PRIORITY_KEYWORDS: ${{ secrets.PRIORITY_KEYWORDS }}
          POST_STATUS: ${{ secrets.POST_STATUS }}
          ENABLE_DEEP_RESEARCH: ${{ vars.ENABLE_DEEP_RESEARCH }}
          ENABLE_IMAGE_VISION_CHECK: ${{ vars.ENABLE_IMAGE_VISION_CHECK }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          MAX_VIDEOS_PER_ARTICLE: ${{ vars.MAX_VIDEOS_PER_ARTICLE }}
          DISABLE_NEWSLETTER_BY_DEFAULT: ${{ vars.DISABLE_NEWSLETTER_BY_DEFAULT }}
          MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN }}
          MAX_BONUS_ARTICLES_PER_RUN: ${{ vars.MAX_BONUS_ARTICLES_PER_RUN }}
          STRONG_STORY_SCORE: ${{ vars.STRONG_STORY_SCORE }}
          MAX_ARTICLES_PER_DAY: ${{ vars.MAX_ARTICLES_PER_DAY }}
        run: python main.py
